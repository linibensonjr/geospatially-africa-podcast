{% load youtube_extras %}
{% with embed_url=youtube_url|youtube_embed thumb_url=youtube_url|youtube_thumb %}
{% if embed_url %}
<div class="yt-embed-facade" data-embed-url="{{ embed_url }}" data-title="{{ title|default:'YouTube video' }}" role="button" tabindex="0" aria-label="Play video: {{ title|default:'YouTube video' }}">
  <img src="{{ thumb_url }}" alt="{{ title|default:'YouTube video thumbnail' }}" class="yt-embed-thumb" loading="lazy">
  <span class="yt-embed-play" aria-hidden="true">
    <span class="yt-embed-play-icon"></span>
  </span>
</div>
{% endif %}
{% endwith %}
